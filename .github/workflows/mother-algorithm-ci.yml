name: Mother Algorithm CI

on:
  pull_request:
    paths:
      - 'scripts/mother_algorithm_v3.py'

jobs:
  lint_and_syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint
        run: |
          flake8 scripts/mother_algorithm_v3.py || true
      - name: Syntax check
        run: |
          python -m py_compile scripts/mother_algorithm_v3.py
