name: Weekly Security Scan

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC
  workflow_dispatch: {}

jobs:
  bandit-scan:
    name: Bandit & Safety weekly scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json || true
      - name: Run Safety
        run: safety check --full-report || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Create issue when findings exist
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            n=$(jq '.results | length' bandit-report.json)
            if [ "$n" -gt 0 ]; then
              gh issue create -R tameem198001-svg/Ras7rba -t "security: weekly Bandit findings ($n)" -b "Bandit weekly scan found $n findings. See artifact in workflow run.\n\nSeal: 55066-55055" -l security || true
            fi
          fi
